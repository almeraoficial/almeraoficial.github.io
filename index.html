<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALMERA | Donde tu vida sube de nivel</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background:#0b0b0b;
    color:white;
}

.hero{
    min-height:100vh;
    background:
    linear-gradient(
        rgba(0,0,0,.45),
        rgba(0,0,0,.65)
    ),
    url("IMAGEN_AMANECER_ALMERA.jpg");

    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
}

.contenido{
    max-width:800px;
}

.logo{
    font-size:55px;
    letter-spacing:12px;
    font-weight:300;
    margin-bottom:20px;
}

.frase{
    font-size:28px;
    font-weight:300;
    margin-bottom:25px;
}

.descripcion{
    font-size:20px;
    line-height:1.6;
    color:#e5e5e5;
    margin-bottom:40px;
}

.boton{
    display:inline-block;
    padding:18px 45px;
    border:1px solid #d4af37;
    color:white;
    text-decoration:none;
    border-radius:40px;
    font-size:18px;
    transition:.3s;
}

.boton:hover{
    background:#d4af37;
    color:black;
}

</style>

</head>

<body>

<section class="hero">

<div class="contenido">

<div class="logo">
ALMERA
</div>

<h1 class="frase">
Donde tu vida sube de nivel
</h1>

<p class="descripcion">
El cambio que buscas comienza con la decisión que tomas hoy.
Construye una versión más fuerte, disciplinada y consciente de ti.
</p>

<a class="boton" href="#">
Comenzar mi transformación
</a>

</div>

</section>


</body>
</html>
